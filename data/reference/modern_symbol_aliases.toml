# Dated aliases connect the point-in-time membership symbol to the Alpaca series.
# Entries marked download_asof require a separate historical-symbol request to avoid
# ticker reuse or incomplete rename mapping in the current-symbol response.

[[alias]]
membership_ticker = "STI"
provider_ticker = "STI"
start = "2019-06-01"
end = "2019-12-06"
download_asof = "2019-06-01"
note = "SunTrust series; current STI is an unrelated reused ticker."

