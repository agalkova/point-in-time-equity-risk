[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-managed-momentum"
version = "0.3.0"
description = "Point-in-time equity drawdown-risk and expected-return research system"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5,<7",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

