name: deploy synthetic AWS workload

on:
  workflow_dispatch:
    inputs:
      enable_schedule:
        description: Enable the weekday EventBridge schedule after the smoke test
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_git_commit_sha: ${{ github.sha }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: equity-risk-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra/terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan infrastructure with schedule disabled
        working-directory: infra/terraform
        run: terraform plan -out=bootstrap.tfplan -var="schedule_state=DISABLED"

      - name: Provision infrastructure with schedule disabled
        working-directory: infra/terraform
        run: terraform apply -auto-approve bootstrap.tfplan

      - name: Read deployment outputs
        id: infra
        working-directory: infra/terraform
        run: |
          echo "repository=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "task_definition=$(terraform output -raw task_definition_arn)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform output -raw artifact_bucket)" >> "$GITHUB_OUTPUT"
          echo "prefix=$(terraform output -raw artifact_prefix)" >> "$GITHUB_OUTPUT"
          echo "subnets=$(terraform output -json subnet_ids | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "security_group=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Check immutable image tag
        id: image
        env:
          REPOSITORY_URL: ${{ steps.infra.outputs.repository }}
        run: |
          REPOSITORY_NAME="${REPOSITORY_URL#*/}"
          if aws ecr describe-images \
            --repository-name "$REPOSITORY_NAME" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build container
        if: steps.image.outputs.exists != 'true'
        run: docker build --tag "${{ steps.infra.outputs.repository }}:${{ github.sha }}" .

      - name: Pull existing immutable image
        if: steps.image.outputs.exists == 'true'
        run: docker pull "${{ steps.infra.outputs.repository }}:${{ github.sha }}"

      - name: Scan container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.infra.outputs.repository }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push immutable image
        if: steps.image.outputs.exists != 'true'
        run: docker push "${{ steps.infra.outputs.repository }}:${{ github.sha }}"

      - name: Refresh task definition with schedule disabled
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var="schedule_state=DISABLED"

      - name: Run smoke-test task
        id: smoke
        env:
          CLUSTER: ${{ steps.infra.outputs.cluster }}
          TASK_DEFINITION: ${{ steps.infra.outputs.task_definition }}
          SUBNETS: ${{ steps.infra.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.infra.outputs.security_group }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          test -n "$TASK_ARN" && test "$TASK_ARN" != "None"
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          test "$EXIT_CODE" = "0"

      - name: Verify immutable artifact
        env:
          BUCKET: ${{ steps.infra.outputs.bucket }}
          PREFIX: ${{ steps.infra.outputs.prefix }}
        run: |
          INPUT_HASH=$(sha256sum data/example/synthetic_bars.csv | cut -d ' ' -f 1)
          RUN_DATE=$(date -u +%F)
          RUN_ID="synthetic-${RUN_DATE}-${INPUT_HASH:0:12}-${GITHUB_SHA:0:8}"
          aws s3api head-object \
            --bucket "$BUCKET" \
            --key "${PREFIX}/runs/${RUN_ID}/manifest.json"
          aws s3 cp "s3://${BUCKET}/${PREFIX}/status/latest.json" latest.json
          jq -e --arg run_id "$RUN_ID" '.status == "PASS" and .run_id == $run_id' latest.json

      - name: Set final schedule state
        working-directory: infra/terraform
        env:
          SCHEDULE_STATE: ${{ inputs.enable_schedule && 'ENABLED' || 'DISABLED' }}
        run: terraform apply -auto-approve -var="schedule_state=${SCHEDULE_STATE}"

      - name: Deployment summary
        working-directory: infra/terraform
        run: |
          echo "### AWS synthetic pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.infra.outputs.repository }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke task: \`${{ steps.smoke.outputs.task_arn }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status page: $(terraform output -raw status_url)" >> "$GITHUB_STEP_SUMMARY"
