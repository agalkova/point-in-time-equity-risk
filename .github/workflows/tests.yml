name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_example_pipeline.py --check
      - run: python scripts/verify_public_repo.py
      - run: python scripts/generate_example_data.py
      - run: git diff --exit-code -- data/example/synthetic_bars.csv
      - run: ruff check .
